---
hvac_monitor:
  service_user: hvacmon
  service_group: hvacmon

  packages:
    - mosquitto
    - mosquitto-clients
    - git
    - curl
    - ca-certificates
    - gnupg
    - python3
    - python3-pip
    - jq

  nodejs:
    major_version: 22

  directories:
    - path: /etc/hvac-monitoring
      owner: root
      group: root
      mode: '0755'
    - path: /opt/zigbee2mqtt
      owner: hvacmon
      group: hvacmon
      mode: '0755'
    - path: /var/lib/zigbee2mqtt
      owner: hvacmon
      group: hvacmon
      mode: '0755'
    - path: /opt/mqtt2prometheus
      owner: hvacmon
      group: hvacmon
      mode: '0755'

  zigbee:
    serial_port: "{{ hvac_monitor_zigbee_serial_port | default('/dev/ttyUSB0') }}"
    adapter: ember
    base_topic: zigbee2mqtt
    network_key: [162, 2, 122, 239, 87, 206, 47, 49, 173, 164, 151, 48, 169, 169, 90, 215]
    # Pin the full network identity, not just the key.  These are zigbee2mqtt's
    # own defaults, which is why a coordinator re-form has so far landed on the
    # same network by luck; stating them makes a rebuilt coordinator re-form an
    # identical network so devices rejoin secured instead of needing re-pairing.
    pan_id: "{{ hvac_monitor_zigbee_pan_id | default(6754) }}"
    ext_pan_id: "{{ hvac_monitor_zigbee_ext_pan_id | default([221, 221, 221, 221, 221, 221, 221, 221]) }}"
    channel: "{{ hvac_monitor_zigbee_channel | default(11) }}"
    # ieee -> friendly_name.  Authoritative: zigbee2mqtt rewrites devices.yaml
    # on join, so a newly paired sensor must be added here or the next run
    # reverts its name.
    devices: "{{ hvac_monitor_zigbee_devices | default({}) }}"

  mqtt:
    host: 127.0.0.1
    port: 1883
    listen_address: 0.0.0.0
    username: hvacmon
    password: change-me

  exporter:
    listen_address: 0.0.0.0
    listen_port: 9641
    metrics_path: /metrics

  zigbee2mqtt:
    repo: https://github.com/Koenkk/zigbee2mqtt.git
    version: 2.9.2
    install_dir: /opt/zigbee2mqtt
    data_dir: /var/lib/zigbee2mqtt
    devices_file: /var/lib/zigbee2mqtt/devices.yaml
    groups_file: /var/lib/zigbee2mqtt/groups.yaml

  mqtt2prometheus:
    package_url: https://github.com/hikhvar/mqtt2prometheus/releases/download/v0.1.7/mqtt2prometheus_0.1.7_linux_arm64.deb
    package_path: /tmp/mqtt2prometheus_0.1.7_linux_arm64.deb
    binary_path: /usr/bin/mqtt2prometheus
    config_path: /etc/hvac-monitoring/mqtt2prometheus.yaml
    cache_timeout: 24h

  homebridge:
    topic_prefix: homebridge/hvac
    sensor_topic_prefix: zigbee2mqtt
