---
- name: Ensure NodeSource repository prerequisites are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download NodeSource repository key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: '0644'
  register: nodesource_repo_key

- name: Check if NodeSource keyring exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/nodesource.gpg
  register: nodesource_keyring

- name: Convert NodeSource repository key to keyring format
  ansible.builtin.command:
    cmd: gpg --dearmor --yes --output /etc/apt/keyrings/nodesource.gpg /etc/apt/keyrings/nodesource.asc
  when: nodesource_repo_key.changed or not nodesource_keyring.stat.exists

- name: Configure NodeSource APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.sources
    content: |
      Types: deb
      URIs: https://deb.nodesource.com/node_{{ hvac_monitor.nodejs.major_version }}.x
      Suites: nodistro
      Components: main
      Signed-By: /etc/apt/keyrings/nodesource.gpg

- name: Install Node.js from NodeSource
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: true

- name: Read installed Node.js major version
  ansible.builtin.shell: node -p "process.versions.node.split('.')[0]"
  changed_when: false
  register: nodejs_major

- name: Ensure Node.js version is supported by Zigbee2MQTT
  ansible.builtin.assert:
    that:
      - (nodejs_major.stdout | int) >= 20
    fail_msg: >-
      Zigbee2MQTT requires Node.js 20+.
      Installed major version is {{ nodejs_major.stdout }}.

- name: Install HVAC monitoring packages
  ansible.builtin.apt:
    name: "{{ hvac_monitor.packages }}"
    state: latest
    update_cache: true

- name: Create HVAC monitoring service user
  ansible.builtin.user:
    name: "{{ hvac_monitor.service_user }}"
    system: true
    shell: /usr/sbin/nologin
    groups: dialout
    comment: "HVAC monitoring service account"
    state: present

- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ hvac_monitor.directories }}"
